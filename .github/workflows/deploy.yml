# Deploy Hosting + Firestore rules + Cloud Functions on push to main.
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   FIREBASE_TOKEN          — from `firebase login:ci`
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN   — matchreadytx.web.app (Hosting host)
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
# Optional Variables:
#   VITE_DEMO_MODE, VITE_DEFAULT_ORG_ID, VITE_APP_ORIGIN, RESEND_FROM_EMAIL
#
# Functions secrets (GOOGLE_SERVICE_ACCOUNT_JSON, RESEND_API_KEY, SHEET_WEBHOOK_SECRET)
# must already exist in Firebase Secret Manager (`firebase functions:secrets:set`).
# Do not put those names in functions/.env.* — Cloud Run rejects secret + plaintext overlap.
# Optional (comma-separated platform admins for Match Calendar) — secret or variable:
#   MATCH_CALENDAR_PLATFORM_ADMIN_UIDS
#   MATCH_CALENDAR_PLATFORM_ADMIN_EMAILS
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build Cloud Functions
        run: npm run build
        working-directory: functions

      - name: Build web app
        run: npm run build
        env:
          # Default true so Try demo stays on production unless you set the Variable to false
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE || 'true' }}
          VITE_DEFAULT_ORG_ID: ${{ vars.VITE_DEFAULT_ORG_ID || 'lonestar' }}
          VITE_APP_ORIGIN: ${{ vars.VITE_APP_ORIGIN || 'https://matchreadytx.web.app' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY || vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APP_BUILD: ${{ github.run_number }}

      # Only defineString params belong in .env.matchreadytx. defineSecret values
      # are bound from Secret Manager; duplicating them here fails Cloud Run.
      - name: Write Functions project env
        run: |
          FROM_EMAIL='${{ vars.RESEND_FROM_EMAIL }}'
          if [ -z "$FROM_EMAIL" ]; then
            FROM_EMAIL='MatchReadyTX <onboarding@resend.dev>'
          fi
          APP_ORIGIN='${{ vars.VITE_APP_ORIGIN || 'https://matchreadytx.web.app' }}'
          ADMIN_UIDS='${{ secrets.MATCH_CALENDAR_PLATFORM_ADMIN_UIDS || vars.MATCH_CALENDAR_PLATFORM_ADMIN_UIDS }}'
          ADMIN_EMAILS='${{ secrets.MATCH_CALENDAR_PLATFORM_ADMIN_EMAILS || vars.MATCH_CALENDAR_PLATFORM_ADMIN_EMAILS }}'
          {
            printf 'RESEND_FROM_EMAIL=%s\n' "$FROM_EMAIL"
            printf 'APP_ORIGIN=%s\n' "$APP_ORIGIN"
            printf 'MATCH_CALENDAR_PLATFORM_ADMIN_UIDS=%s\n' "$ADMIN_UIDS"
            printf 'MATCH_CALENDAR_PLATFORM_ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS"
          } > functions/.env.matchreadytx
          echo "Wrote functions/.env.matchreadytx (string params only) for non-interactive deploy"

      - name: Deploy to Firebase
        run: npx firebase-tools@13 deploy --only hosting,firestore,functions --project matchreadytx --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
