# Deploy Hosting + Firestore rules + Cloud Functions on push to main.
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   FIREBASE_TOKEN          — from `firebase login:ci`
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN   — matchreadytx.web.app (Hosting host)
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
# Optional Variables:
#   VITE_DEMO_MODE, VITE_DEFAULT_ORG_ID, VITE_APP_ORIGIN, RESEND_FROM_EMAIL
#
# Functions deploy (non-interactive) also needs these in GitHub Actions secrets
# (same values as Firebase Secret Manager / local functions/.env.matchreadytx):
#   GOOGLE_SERVICE_ACCOUNT_JSON
#   RESEND_API_KEY
#   SHEET_WEBHOOK_SECRET
# Optional (comma-separated platform admins for Match Calendar) — secret or variable:
#   MATCH_CALENDAR_PLATFORM_ADMIN_UIDS
#   MATCH_CALENDAR_PLATFORM_ADMIN_EMAILS
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build Cloud Functions
        run: npm run build
        working-directory: functions

      - name: Build web app
        run: npm run build
        env:
          # Default true so Try demo stays on production unless you set the Variable to false
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE || 'true' }}
          VITE_DEFAULT_ORG_ID: ${{ vars.VITE_DEFAULT_ORG_ID || 'lonestar' }}
          VITE_APP_ORIGIN: ${{ vars.VITE_APP_ORIGIN || 'https://matchreadytx.web.app' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY || vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APP_BUILD: ${{ github.run_number }}

      # Non-interactive Functions deploy needs all defineSecret/defineString values
      # in functions/.env.matchreadytx (firebase-tools reads this at deploy time).
      - name: Write Functions project env
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SHEET_WEBHOOK_SECRET: ${{ secrets.SHEET_WEBHOOK_SECRET }}
        run: |
          FROM_EMAIL='${{ vars.RESEND_FROM_EMAIL }}'
          if [ -z "$FROM_EMAIL" ]; then
            FROM_EMAIL='MatchReadyTX <onboarding@resend.dev>'
          fi
          APP_ORIGIN='${{ vars.VITE_APP_ORIGIN || 'https://matchreadytx.web.app' }}'
          ADMIN_UIDS='${{ secrets.MATCH_CALENDAR_PLATFORM_ADMIN_UIDS || vars.MATCH_CALENDAR_PLATFORM_ADMIN_UIDS }}'
          ADMIN_EMAILS='${{ secrets.MATCH_CALENDAR_PLATFORM_ADMIN_EMAILS || vars.MATCH_CALENDAR_PLATFORM_ADMIN_EMAILS }}'
          missing=()
          for name in GOOGLE_SERVICE_ACCOUNT_JSON RESEND_API_KEY SHEET_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets required for Functions deploy: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions (same values as firebase functions:secrets:set)."
            exit 1
          fi
          # Dotenv must be one KEY=value per line — minify multi-line service account JSON.
          GOOGLE_SA_JSON=$(printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | jq -c .) || {
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON"
            exit 1
          }
          {
            printf 'RESEND_FROM_EMAIL=%s\n' "$FROM_EMAIL"
            printf 'APP_ORIGIN=%s\n' "$APP_ORIGIN"
            printf 'MATCH_CALENDAR_PLATFORM_ADMIN_UIDS=%s\n' "$ADMIN_UIDS"
            printf 'MATCH_CALENDAR_PLATFORM_ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS"
            printf 'GOOGLE_SERVICE_ACCOUNT_JSON=%s\n' "$GOOGLE_SA_JSON"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'SHEET_WEBHOOK_SECRET=%s\n' "$SHEET_WEBHOOK_SECRET"
          } > functions/.env.matchreadytx
          echo "Wrote functions/.env.matchreadytx for non-interactive deploy"

      - name: Deploy to Firebase
        run: npx firebase-tools@13 deploy --only hosting,firestore,functions --project matchreadytx --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
